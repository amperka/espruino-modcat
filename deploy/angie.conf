# Angie config for the Espruino module catalog (js.amperka.ru).
#
# The image is self-contained: angie serves modules/, binaries/ and json/ from
# /srv/espruino-modcat/site and sends the requests it does not carry to
# espruino.com. The container knows nothing about TLS or hostnames - it answers
# on any host over http on port 8080, and an outer proxy terminates TLS and
# routes the name here. Port 8080 instead of 80 so the image runs unprivileged.

server {
    listen      8080 default_server;
    server_name _;

    root    /srv/espruino-modcat/site;
    charset utf-8;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    port_in_redirect off;

    proxy_http_version 1.1;
    proxy_intercept_errors on;
    # Locations that overwrite a request header repeat this complete set,
    # because proxy_set_header is not inherited then.
    proxy_set_header Proxy "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass_request_headers on;
    proxy_redirect off;

    location ~ ^/(yodo|jodo)\/?(?<baseuri>.*) {
        return 302 https://wiki.amperka.ru/yodo;
    }

    # boards.json is espruino.com's catalog with the ISKRAJS board spliced in:
    # the local json/boards.json cannot replace it, because the IDE needs every
    # board espruino.com knows about, not only ours.
    location ~ ^/json/boards.json\/?(.*) {
        # A context that declares any add_header of its own inherits none, so
        # the CORS set is repeated wherever a header is added - including the
        # `if` blocks below, whose responses would otherwise lose it.
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        if ($request_method = 'GET') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';
        }

        # Location-level proxy_set_header replaces all server-level entries,
        # so the full set is repeated here.
        proxy_set_header Host "www.espruino.com";
        proxy_set_header Proxy "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # sub_filter rewrites only a body the upstream left uncompressed.
        proxy_set_header Accept-Encoding '';
        proxy_pass http://www.espruino.com:80;
        sub_filter_types '*';
        sub_filter '{' '{"ISKRAJS":{"json":"ISKRAJS.json"},';
    }

    # A module, binary or json file that is not in the image is not ours: the
    # IDE asked for a stock espruino.com file, so point it there. Plain http on
    # purpose: the client is the Espruino JS runtime on a board, which has no
    # memory for TLS, so an https redirect would break it.
    location @redirecto_to_espruino {
        rewrite ^/(.*)$ http://espruino.com/$1 redirect;
    }

    location / {
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        if ($request_method = 'GET') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';
        }

        if ($uri = /) {
            return 302 https://wiki.amperka.ru/js:;
        }
        if ($uri ~ /(binaries|json|modules)\/?(.*)) {
            # 403 joins 404 for the catalog paths: a URL that names a directory
            # opens nothing (the catalog has no listings), so it means the same
            # as a missing file and takes the same fallback.
            error_page 403 404 = @redirecto_to_espruino;
        }

        # Everything is served from the image's own disk.
        try_files $uri =404;
    }
}
