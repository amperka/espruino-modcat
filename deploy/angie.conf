# Angie config for the Espruino module catalog (js.amperka.ru).
#
# The image is self-contained: angie serves modules/, binaries/ and json/ from
# /srv/espruino-modcat/site and sends the requests it does not carry to
# espruino.com. The container knows nothing about TLS or hostnames - it answers
# on any host over http on port 8080, and an outer proxy terminates TLS and
# routes the name here. Port 8080 instead of 80 so the image runs unprivileged.

# The fallback redirect target follows the client's own protocol. Devices talk
# plain http - the Espruino runtime on a board has no memory for TLS - while
# browsers arrive through the outer proxy, which passes X-Forwarded-Proto. The
# https branch aims at www.espruino.com directly: espruino.com itself answers
# an https request with a 301 down to plain http://www.espruino.com, a hop a
# browser would reject as mixed content.
map $http_x_forwarded_proto $espruino_origin {
    default http://espruino.com;
    https   https://www.espruino.com;
}

server {
    listen      8080 default_server;
    server_name _;

    root    /srv/espruino-modcat/site;
    charset utf-8;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    port_in_redirect off;

    proxy_http_version 1.1;
    proxy_intercept_errors on;
    # Locations that overwrite a request header repeat this complete set,
    # because proxy_set_header is not inherited then.
    proxy_set_header Proxy "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass_request_headers on;
    proxy_redirect off;

    location ~ ^/(yodo|jodo)\/?(?<baseuri>.*) {
        return 302 https://wiki.amperka.ru/yodo;
    }

    # boards.json is espruino.com's catalog with the ISKRAJS board spliced in:
    # the IDE needs every board espruino.com knows about, not only ours. When
    # espruino.com is unreachable or errors out, the bundled catalog answers
    # instead: it lists ISKRAJS alone, which keeps the local toolchain - board
    # json and firmware binaries - usable through an upstream outage.
    location ~ ^/json/boards.json\/?(.*) {
        error_page 404 500 502 503 504 = @boards_local;
        # www.espruino.com sends its own Access-Control-Allow-Origin, which
        # would arrive next to the one added below - a repeated CORS header
        # that browsers reject outright. The upstream's CORS set is dropped so
        # this location always speaks for itself.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;
        # A context that declares any add_header of its own inherits none, so
        # the CORS set is repeated wherever a header is added - including the
        # `if` blocks below, whose responses would otherwise lose it.
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        if ($request_method = 'GET') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';
        }

        # Location-level proxy_set_header replaces all server-level entries,
        # so the full set is repeated here.
        proxy_set_header Host "www.espruino.com";
        proxy_set_header Proxy "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # sub_filter rewrites only a body the upstream left uncompressed.
        proxy_set_header Accept-Encoding '';
        proxy_pass http://www.espruino.com:80;
        sub_filter_types '*';
        sub_filter '{' '{"ISKRAJS":{"json":"ISKRAJS.json"},';
    }

    # The boards.json fallback: try_files serves the file in this context - it
    # does not re-run location matching, so the URI does not loop back into the
    # proxied location above. The CORS set is repeated because a named location
    # inherits headers from the server level only, and the server level carries
    # none.
    location @boards_local {
        try_files /json/boards.json =404;
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
    }

    # A module, binary or json file that is not in the image is not ours: the
    # IDE asked for a stock espruino.com file, so point it there. The target
    # follows the client's protocol - see the map above - and the CORS set is
    # repeated for the same reason as in @boards_local: without it a browser
    # cannot follow the redirect at all.
    location @redirecto_to_espruino {
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
        rewrite ^/(.*)$ $espruino_origin/$1 redirect;
    }

    location / {
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        if ($request_method = 'GET') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';
        }

        if ($uri = /) {
            return 302 https://wiki.amperka.ru/js:;
        }
        if ($uri ~ /(binaries|json|modules)\/?(.*)) {
            # 403 joins 404 for the catalog paths: a URL that names a directory
            # opens nothing (the catalog has no listings), so it means the same
            # as a missing file and takes the same fallback.
            error_page 403 404 = @redirecto_to_espruino;
        }

        # Everything is served from the image's own disk.
        try_files $uri =404;
    }
}
