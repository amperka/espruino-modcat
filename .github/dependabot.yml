# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

# The Angie registry is public, so the values are placeholders: the Dependabot
# proxy lets a job reach a host only when its registry is declared here and
# referenced by the update below.
registries:
  angie:
    type: docker-registry
    url: https://docker.angie.software
    username: dependabot
    password: public-registry

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "docker"
    directory: "/"
    registries:
      - angie
    schedule:
      interval: "monthly"
