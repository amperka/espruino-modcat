name: PR
permissions:
  contents: read

on:
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - run: npm ci
      - run: npm run verify
      - run: npm run build
